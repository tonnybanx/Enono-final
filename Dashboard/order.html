<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enono Market - Orders</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        body {
            background-color: #f8fafc;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
        }
        tr {
            transition: background-color 0.2s;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .action-btn {
            opacity: 0;
            transform: translateX(10px);
            transition: all 0.25s ease;
        }
        tr:hover .action-btn {
            opacity: 1;
            transform: translateX(0);
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar w-[280px] h-full bg-[#0f172a] shadow-xl flex flex-col fixed lg:relative z-50">
        <div class="w-full h-[70px] border-b border-gray-700 flex items-center pl-6 text-white">
            <div>
                <div class="text-3xl font-bold tracking-tight">Enono</div>
                <div class="text-xs font-light text-yellow-400 -mt-1">MARKET</div>
            </div>
        </div>

        <div class="text-white text-sm flex flex-col gap-1 mt-8 px-3">
            <a href="home.html" onclick="setActive(this)" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-home w-5"></i><span>Dashboard</span>
            </a>
            <a href="product.html" onclick="setActive(this)" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-cube w-5"></i><span>Products</span>
            </a>
            <a href="add-product.html" onclick="setActive(this)" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-plus-square w-5"></i><span>Add Product</span>
            </a>
            <a href="order.html" onclick="setActive(this)" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-700">
                <i class="fa fa-shopping-cart w-5"></i><span>Orders</span>
            </a>
            <a href="customers.html" onclick="setActive(this)" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-users w-5"></i><span>Customers</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">

        <!-- Top Bar -->
        <div class="h-[70px] bg-white border-b border-gray-100 flex items-center px-6 shadow-sm z-40">
            <button id="toggleSidebar" class="lg:hidden text-2xl text-gray-600 hover:text-gray-900 mr-4">
                <i class="fa fa-bars"></i>
            </button>
            
            <div class="flex-1 max-w-md">
                <div class="relative">
                    <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search products, orders..." 
                           class="w-full bg-gray-100 border border-transparent focus:border-gray-300 rounded-2xl py-3 pl-12 pr-5 focus:outline-none text-sm">
                </div>
            </div>

            <div class="flex items-center gap-6 ml-auto">
                <button class="text-gray-600 hover:text-gray-900 relative">
                    <i class="fa fa-bell text-xl"></i>
                    <span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-full">3</span>
                </button>
                <div class="flex items-center gap-3">
                    <img src="https://picsum.photos/id/64/128/128" alt="Profile" 
                         class="w-9 h-9 rounded-2xl object-cover border border-gray-200">
                </div>
            </div>
        </div>

        <!-- Orders Content -->
        <div class="flex-1 overflow-auto p-6">
            <div class="max-w-7xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-semibold text-gray-900">Orders</h1>
                        <p class="text-gray-500">6 of 6 orders</p>
                    </div>
                </div>

                <!-- Search & Filter -->
                <div class="flex flex-col md:flex-row gap-4 mb-6">
                    <div class="flex-1 relative">
                        <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="searchInput"
                               class="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500"
                               placeholder="Search by customer or order #">
                    </div>
                    <div class="w-full md:w-64">
                        <select class="w-full px-4 py-3 bg-white border border-gray-200 rounded-2xl focus:outline-none focus:border-blue-500">
                            <option>All statuses</option>
                            <option>Pending</option>
                            <option>Packed</option>
                            <option>Shipped</option>
                            <option>Delivered</option>
                        </select>
                    </div>
                </div>

                <!-- Selection Bar -->
                <div id="selectionBar" class="hidden bg-white border border-gray-200 rounded-2xl p-4 flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <span class="font-medium text-gray-700">1 selected</span>
                        <button onclick="clearSelection()" class="text-blue-600 hover:text-blue-700 font-medium">Clear</button>
                    </div>
                    <button onclick="deleteSelected()" 
                            class="bg-red-600 hover:bg-red-700 text-white px-5 py-2.5 rounded-xl flex items-center gap-2 font-medium">
                        <i class="fa fa-trash"></i>
                        Delete selected
                    </button>
                </div>

                <!-- Orders Table -->
                <div class="card overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-50 border-b border-gray-200">
                            <tr class="text-left text-sm text-gray-600">
                                <th class="w-10 p-4"><input type="checkbox" id="selectAll" class="w-4 h-4"></th>
                                <th class="p-4 font-medium">Order</th>
                                <th class="p-4 font-medium">Customer</th>
                                <th class="p-4 font-medium">Date</th>
                                <th class="p-4 font-medium">Items</th>
                                <th class="p-4 font-medium">Total</th>
                                <th class="p-4 font-medium">Payment</th>
                                <th class="p-4 font-medium">Status</th>
                                <th class="w-32 p-4 font-medium"></th>
                            </tr>
                        </thead>
                        <tbody class="text-sm divide-y divide-gray-100" id="ordersTable">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Mobile Overlay -->
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"></div>

    <script>
        const orders = [
            { id: "#3421", customer: "Emma Watson", email: "emma@example.com", date: "Jul 17, 2026", items: 2, total: "UGX 1,339", payment: "Visa •••• 4242", status: "Pending" },
            { id: "#3420", customer: "Liam Bennett", email: "liam@example.com", date: "Jul 17, 2026", items: 2, total: "UGX 323", payment: "Mastercard •••• 1187", status: "Packed" },
            { id: "#3419", customer: "Noah Kim", email: "noah@example.com", date: "Jul 16, 2026", items: 1, total: "UGX 145", payment: "PayPal", status: "Shipped" },
            { id: "#3418", customer: "Sara Ali", email: "sara@example.com", date: "Jul 15, 2026", items: 2, total: "UGX 1,480", payment: "Visa •••• 0900", status: "Delivered" },
            { id: "#3417", customer: "Mateo García", email: "mateo@example.com", date: "Jul 17, 2026", items: 2, total: "UGX 243", payment: "Amex •••• 3311", status: "Pending" }
        ];

        function renderOrders() {
            const tbody = document.getElementById('ordersTable');
            tbody.innerHTML = orders.map(order => `
                <tr class="group">
                    <td class="p-4"><input type="checkbox" class="w-4 h-4 order-checkbox" data-id="${order.id}"></td>
                    <td class="p-4 font-medium text-blue-600">${order.id}</td>
                    <td class="p-4">
                        <div class="font-medium">${order.customer}</div>
                        <div class="text-xs text-gray-500">${order.email}</div>
                    </td>
                    <td class="p-4 text-gray-600">${order.date}</td>
                    <td class="p-4 text-center font-medium">${order.items}</td>
                    <td class="p-4 font-medium">${order.total}</td>
                    <td class="p-4 text-gray-600">${order.payment}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium
                            ${order.status === 'Delivered' ? 'bg-green-100 text-green-700' : ''}
                            ${order.status === 'Shipped' ? 'bg-purple-100 text-purple-700' : ''}
                            ${order.status === 'Packed' ? 'bg-blue-100 text-blue-700' : ''}
                            ${order.status === 'Pending' ? 'bg-yellow-100 text-yellow-700' : ''}">
                            <span class="status-dot mr-1.5 
                                ${order.status === 'Delivered' ? 'bg-green-500' : ''}
                                ${order.status === 'Shipped' ? 'bg-purple-500' : ''}
                                ${order.status === 'Packed' ? 'bg-blue-500' : ''}
                                ${order.status === 'Pending' ? 'bg-yellow-500' : ''}"></span>
                            ${order.status}
                        </span>
                    </td>
                    <td class="p-4">
                        <button onclick="processOrder('${order.id}')" 
                                class="action-btn bg-white border border-gray-300 hover:border-gray-400 text-gray-700 px-4 py-2 rounded-xl text-sm font-medium flex items-center gap-2 whitespace-nowrap">
                            <i class="fa fa-cog text-gray-500"></i>
                            Process
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function processOrder(orderId) {
            alert(`Processing order ${orderId}...`);
        }

        // Selection Logic
        function updateSelectionBar() {
            const selected = document.querySelectorAll('.order-checkbox:checked').length;
            const selectionBar = document.getElementById('selectionBar');
            selectionBar.classList.toggle('hidden', selected === 0);
            if (selected > 0) {
                selectionBar.querySelector('span').textContent = `${selected} selected`;
            }
        }

        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('order-checkbox')) updateSelectionBar();
        });

        function clearSelection() {
            document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = false);
            document.getElementById('selectionBar').classList.add('hidden');
        }

        function deleteSelected() {
            if (confirm("Delete selected orders?")) {
                alert("Selected orders have been deleted.");
                clearSelection();
            }
        }

        // Sidebar Functions
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('hidden');
        }

        function setActive(el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('bg-gray-700'));
            el.classList.add('bg-gray-700');
        }

        // Initialize
        renderOrders();
        document.getElementById('selectAll').addEventListener('change', function() {
            document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = this.checked);
            updateSelectionBar();
        });
    </script>
</body>
</html>
