<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enono Market - Products</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <style>
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
        }

        .overlay { display: none; background: rgba(0, 0, 0, 0.5); }

        .product-img { width: 48px; height: 48px; object-fit: cover; border-radius: 8px; }

        .status-active {
            background-color: #10b981; color: white;
            padding: 4px 12px; border-radius: 9999px;
            font-size: 13px; font-weight: 500;
        }

        .action-icons {
            opacity: 0; transform: translateX(10px);
            transition: all 0.2s ease;
        }
        tr:hover .action-icons {
            opacity: 1; transform: translateX(0);
        }

        /* Modal Styles */
        .modal {
            animation: modalPop 0.3s ease;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="w-full h-screen flex overflow-hidden bg-gray-50">

       <!-- Sidebar -->
    <div class="w-[280px] h-full bg-[#0f172a] shadow-xl flex flex-col fixed lg:relative z-50">
        <div class="w-full h-[70px] border-b border-gray-700 flex items-center pl-6 text-white">
            <div>
                <div class="text-3xl font-bold tracking-tight">Enono</div>
                <div class="text-xs font-light text-yellow-400 -mt-1">MARKET</div>
            </div>
        </div>

        <div class="text-white text-sm flex flex-col gap-1 mt-8 px-3">
            <a href="home.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-home w-5"></i><span>Dashboard</span>
            </a>
            <a href="product.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl bg-gray-700">
                <i class="fa fa-cube w-5"></i><span>Products</span>
            </a>
            <a href="add-product.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-plus-square w-5"></i><span>Add Product</span>
            </a>
            <a href="order.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-shopping-cart w-5"></i><span>Orders</span>
            </a>
            <a href="customers.html" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-700">
                <i class="fa fa-users w-5"></i><span>Customers</span>
            </a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <div class="h-[70px] bg-white border-b border-gray-100 flex items-center px-6 shadow-sm z-40">
            <button id="toggleSidebar" class="lg:hidden text-2xl text-gray-600 hover:text-gray-900 mr-4">
                <i class="fa fa-bars"></i>
            </button>
            <div class="flex-1 max-w-md">
                <div class="relative">
                    <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" placeholder="Search by name or SKU" 
                           class="w-full bg-gray-100 border border-transparent focus:border-gray-300 rounded-2xl py-3 pl-12 pr-5 focus:outline-none text-sm">
                </div>
            </div>
            <div class="flex items-center gap-6 ml-auto">
                <button class="text-gray-600 hover:text-gray-900"><i class="fa fa-bell text-xl"></i></button>
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-sm font-semibold">Sarah</div>
                        <div class="text-xs text-gray-500">Admin</div>
                    </div>
                    <img src="https://picsum.photos/id/64/128/128" alt="Profile" class="w-9 h-9 rounded-2xl object-cover">
                </div>
            </div>
        </div>

        <!-- Products Content -->
        <div class="flex-1 overflow-auto p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Products</h1>
                    <p class="text-gray-500">8 of 8 products</p>
                </div>
                <button onclick="addProduct()" class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-medium">
                    <i class="fa fa-plus"></i><span>Add product</span>
                </button>
            </div>

            <!-- Filters & Table (same as before) -->
            <div class="flex flex-wrap gap-4 mb-6">
                <div class="flex-1 min-w-[280px]">
                    <div class="relative">
                        <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" placeholder="Search by name or SKU" class="w-full bg-white border border-gray-300 rounded-2xl py-3 pl-12 pr-5 focus:outline-none">
                    </div>
                </div>
                <div class="w-64">
                    <select class="w-full bg-white border border-gray-300 rounded-2xl py-3 px-5 focus:outline-none">
                        <option>All categories</option>
                    </select>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-sm overflow-hidden">
                <table class="w-full">
                    <thead>
                        <tr class="border-b text-left text-gray-500 text-sm">
                            <th class="px-6 py-5 w-10"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                            <th class="px-6 py-5">Product</th>
                            <th class="px-6 py-5">SKU</th>
                            <th class="px-6 py-5">Category</th>
                            <th class="px-6 py-5">Supplier</th>
                            <th class="px-6 py-5">Price</th>
                            <th class="px-6 py-5">Stock</th>
                            <th class="px-6 py-5">Status</th>
                            <th class="px-6 py-5 w-32">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTable" class="text-sm divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Mobile Overlay -->
    <div id="overlay" onclick="toggleSidebar()" class="overlay fixed inset-0 z-40 lg:hidden"></div>

    <!-- Preview Modal -->
    <div id="previewModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="modal bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold" id="modalProductName"></h2>
                    <button onclick="closeModals()" class="text-gray-400 hover:text-gray-600 text-3xl leading-none">&times;</button>
                </div>
                <img id="modalProductImage" class="w-full h-64 object-cover rounded-2xl mb-6" alt="">
                <div class="grid grid-cols-2 gap-4 text-sm">
                    <div><span class="text-gray-500">SKU:</span> <span id="modalSKU" class="font-medium"></span></div>
                    <div><span class="text-gray-500">Category:</span> <span id="modalCategory"></span></div>
                    <div><span class="text-gray-500">Supplier:</span> <span id="modalSupplier"></span></div>
                    <div><span class="text-gray-500">Price:</span> <span id="modalPrice" class="font-semibold"></span></div>
                    <div><span class="text-gray-500">Stock:</span> <span id="modalStock"></span></div>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 border-t">
                <button onclick="closeModals()" class="px-6 py-3 rounded-2xl border hover:bg-gray-100">Close</button>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="modal bg-white rounded-3xl shadow-2xl w-full max-w-lg mx-4">
            <div class="p-6">
                <h2 class="text-2xl font-bold mb-6">Edit Product</h2>
                <div class="space-y-4">
                    <input id="editName" type="text" class="w-full border rounded-2xl px-4 py-3" placeholder="Product Name">
                    <div class="grid grid-cols-2 gap-4">
                        <input id="editSKU" type="text" class="border rounded-2xl px-4 py-3" placeholder="SKU">
                        <input id="editPrice" type="text" class="border rounded-2xl px-4 py-3" placeholder="Price">
                    </div>
                    <input id="editStock" type="number" class="w-full border rounded-2xl px-4 py-3" placeholder="Stock">
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 flex justify-end gap-3 border-t rounded-b-3xl">
                <button onclick="closeModals()" class="px-6 py-3 rounded-2xl border hover:bg-gray-100">Cancel</button>
                <button onclick="saveProduct()" class="px-6 py-3 bg-blue-600 text-white rounded-2xl hover:bg-blue-700">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="modal bg-white rounded-3xl shadow-2xl w-full max-w-md mx-4 p-6">
            <h2 class="text-xl font-semibold mb-2">Delete Product?</h2>
            <p class="text-gray-600 mb-6" id="deleteMessage">This action cannot be undone.</p>
            <div class="flex justify-end gap-3">
                <button onclick="closeModals()" class="px-6 py-3 rounded-2xl border hover:bg-gray-100">Cancel</button>
                <button onclick="confirmDelete()" class="px-6 py-3 bg-red-600 text-white rounded-2xl hover:bg-red-700">Yes, Delete</button>
            </div>
        </div>
    </div>

    <script>
        let currentProductId = null;

        const products = [
            { id: 1, name: "Aeron Ergonomic Chair", sku: "CHR-AER-01", category: "Furniture", supplier: "Northwind Traders", price: "UGX 899", stock: 24, image: "https://picsum.photos/id/20/600/400" },
            { id: 2, name: "Kyoto Ceramic Vase", sku: "DEC-KYT-14", category: "Decor", supplier: "Kyoto Imports", price: "UGX 65", stock: 120, image: "https://picsum.photos/id/201/600/400" },
            // Add more as needed
        ];

        function populateProducts() {
            const tbody = document.getElementById('productsTable');
            let html = '';
            products.forEach(p => {
                html += `
                    <tr class="group hover:bg-gray-50 transition-colors">
                        <td class="px-6 py-5"><input type="checkbox" class="product-checkbox" onchange="updateSelection()"></td>
                        <td class="px-6 py-5">
                            <div class="flex items-center gap-4">
                                <img src="${p.image}" class="product-img" alt="${p.name}">
                                <span class="font-medium">${p.name}</span>
                            </div>
                        </td>
                        <td class="px-6 py-5 text-gray-600">${p.sku}</td>
                        <td class="px-6 py-5">${p.category}</td>
                        <td class="px-6 py-5">${p.supplier}</td>
                        <td class="px-6 py-5 font-medium">${p.price}</td>
                        <td class="px-6 py-5">${p.stock}</td>
                        <td class="px-6 py-5"><span class="status-active">Active</span></td>
                        <td class="px-6 py-5">
                            <div class="action-icons flex items-center justify-end gap-2 text-gray-500">
                                <button onclick="previewProduct(${p.id})" class="hover:text-blue-600 p-2 hover:bg-gray-100 rounded-xl"><i class="fa fa-eye"></i></button>
                                <button onclick="editProduct(${p.id})" class="hover:text-amber-600 p-2 hover:bg-gray-100 rounded-xl"><i class="fa fa-edit"></i></button>
                                <button onclick="deleteProduct(${p.id})" class="hover:text-red-600 p-2 hover:bg-gray-100 rounded-xl"><i class="fa fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>`;
            });
            tbody.innerHTML = html;
        }

        // Modal Functions
        function showModal(modalId) {
            document.getElementById(modalId).classList.remove('hidden');
            document.getElementById(modalId).style.display = 'flex';
        }

        function closeModals() {
            document.querySelectorAll('.fixed.inset-0').forEach(modal => {
                modal.classList.add('hidden');
                modal.style.display = 'none';
            });
        }

        function previewProduct(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            document.getElementById('modalProductName').textContent = product.name;
            document.getElementById('modalProductImage').src = product.image;
            document.getElementById('modalSKU').textContent = product.sku;
            document.getElementById('modalCategory').textContent = product.category;
            document.getElementById('modalSupplier').textContent = product.supplier;
            document.getElementById('modalPrice').textContent = product.price;
            document.getElementById('modalStock').textContent = product.stock;

            showModal('previewModal');
        }

        function editProduct(id) {
            currentProductId = id;
            const product = products.find(p => p.id === id);
            if (!product) return;

            document.getElementById('editName').value = product.name;
            document.getElementById('editSKU').value = product.sku;
            document.getElementById('editPrice').value = product.price;
            document.getElementById('editStock').value = product.stock;

            showModal('editModal');
        }

        function saveProduct() {
            alert("Product updated successfully! (Demo)");
            closeModals();
        }

        function deleteProduct(id) {
            currentProductId = id;
            document.getElementById('deleteMessage').textContent = `Are you sure you want to delete this product?`;
            showModal('deleteModal');
        }

        function confirmDelete() {
            alert(`Product ID ${currentProductId} has been deleted.`);
            closeModals();
        }

        // Other functions (toggleSidebar, selection, etc.)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            if (window.innerWidth <= 1024) overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        }

        function addProduct() { alert("Add Product form coming soon..."); }

        window.onload = () => {
            populateProducts();
            document.getElementById('toggleSidebar').addEventListener('click', toggleSidebar);
        };
    </script>
</body>
</html>
