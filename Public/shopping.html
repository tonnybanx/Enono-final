<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop - Enono Ugandan Heritage Crafts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        .heading-font { font-family: 'Playfair Display', serif; }
        .body-font { font-family: 'Inter', system-ui, sans-serif; }

        .product-card {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            cursor: pointer;
        }
        .product-card:hover {
            transform: translateY(-6px);
        }
        .product-card img {
            transition: transform 0.6s ease;
        }
        .product-card:hover img {
            transform: scale(1.05);
        }

        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="body-font bg-white text-gray-800">

    <!-- Navbar with Search -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-5">
            <div class="flex flex-col md:flex-row md:items-center gap-4 md:gap-8">
                <!-- Logo -->
                <div class="flex items-center gap-3">
                    <span class="heading-font text-3xl font-bold">Enono</span>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-2xl">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input 
                            id="search-input"
                            type="text" 
                            placeholder="Search crafts... " 
                            class="w-full border border-gray-200 rounded-3xl py-4 pl-14 pr-6 focus:outline-none focus:border-[#9b49a0] text-base">
                    </div>
                </div>

                <!-- Right side -->
                <div class="flex items-center gap-6">
                    <a href="../index.html" class="text-gray-600 hover:text-[#8B4513]">Back to Home</a>
                    <button onclick="toggleCart()" class="flex items-center gap-2 relative">
                        <i class="fa-solid fa-cart-shopping text-2xl"></i>
                        <span id="cart-count" class="absolute -top-1 -right-1 bg-[#8B4513] text-white text-xs w-5 h-5 flex items-center justify-center rounded-full">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="mx-auto ">
       <div class="w-full bg-[#faf5ef]">
         <!-- Header -->
        <div class="mb-10 pt-10 max-w-7xl mx-auto px-6 pb-4">
            <p class="uppercase tracking-widest text-amber-800 text-sm font-medium">THE COLLECTION</p>
            <h1 class="heading-font text-2xl md:text-4xl font-semibold">Shop Buganda Crafts</h1>
        </div>

        <!-- Category Filters -->
        <div class="flex flex-wrap gap-3 justify-start mb-12 scrollbar-hide overflow-x-auto pb-4 max-w-7xl mx-auto px-6 max-sm:hidden">
            <button onclick="filterCategory('all')" class="category-btn active px-8 py-3 bg-[#8B4513] text-white rounded-3xl text-sm font-medium">All</button>
            <button onclick="filterCategory('drums')" class="category-btn px-8 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-3xl text-sm font-medium">Drums</button>
            <button onclick="filterCategory('stools')" class="category-btn px-8 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-3xl text-sm font-medium">Stools</button>
            <button onclick="filterCategory('jewelry')" class="category-btn px-8 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-3xl text-sm font-medium">Jewelry</button>
            <button onclick="filterCategory('pipes')" class="category-btn px-8 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-3xl text-sm font-medium">Pipes</button>
            <button onclick="filterCategory('pottery')" class="category-btn px-8 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-3xl text-sm font-medium">Pottery</button>
            <button onclick="filterCategory('barkcloth')" class="category-btn px-8 py-3 bg-white border border-gray-200 hover:bg-gray-50 rounded-3xl text-sm font-medium">Bark Cloth</button>
        </div>
       </div>

       <div class="w-full px-6 pb-10 max-w-7xl mx-auto">
         <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Populated by JS -->
        </div>

        <div id="no-results" class="hidden text-center py-20 text-gray-400">
            <p class="text-2xl">No products found.</p>
        </div>
       </div>
    </div>

    <!-- CART DRAWER (Same as index.html) -->
    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl translate-x-full transition-transform duration-300 z-[120] flex flex-col border-l border-gray-200">
        <div class="p-6 border-b flex justify-between items-center">
            <h2 class="text-2xl font-semibold">Shopping Cart</h2>
            <button onclick="toggleCart()" class="text-3xl leading-none">×</button>
        </div>
        <div id="cart-items" class="flex-1 p-6 overflow-auto"></div>
        <div class="p-6 border-t">
            <div class="flex justify-between text-xl font-medium mb-6">
                <span>Total</span>
                <span id="cart-total">USH 0</span>
            </div>
            <button onclick="checkout()" class="w-full bg-[#8B4513] text-white py-4 rounded-2xl font-medium">Proceed to Checkout</button>
        </div>
    </div>

    <script>
        const products = [
            {id:1, name:"Long Drum (Engalabi)", price:110000, category:"drums", desc:"Tall single-headed drum with lizard-skin membrane.", img:"../images/drum1.jpg"},
            {id:2, name:"Royal Carved Stool (Entebe)", price:130000, category:"stools", desc:"Polished hardwood stool carved from one piece.", img:"../images/basket1.jpg"},
            {id:3, name:"Beaded Adornment Set (Obutiiti)", price:38000, category:"jewelry", desc:"Earthy strung beads in red, ochre and black.", img:"../images/jewelery1.jpg"},
            {id:4, name:"Royal Clay Smoking Pipe (Emindi)", price:85000, category:"pipes", desc:"Hand-shaped clay bowl on a long carved stem, used in elders' councils.", img:"../images/pipe2.jpg"},
            {id:5, name:"Ankole Clay Water Pot", price:95000, category:"pottery", desc:"Hand-coiled terracotta water pot burnished with natural ochre.", img:"../images/pot2.jpg"},
            {id:6, name:"Barkcloth Wall Hanging", price:75000, category:"barkcloth", desc:"Traditional Buganda barkcloth with rich terracotta tones.", img:"../images/barkcloth1.jpg"}
        ];

        let cart = [];
        let currentFilter = 'all';

        function renderProducts(filteredProducts) {
            const container = document.getElementById('products-grid');
            container.innerHTML = '';

            if (filteredProducts.length === 0) {
                document.getElementById('no-results').classList.remove('hidden');
                return;
            }
            document.getElementById('no-results').classList.add('hidden');

            filteredProducts.forEach(p => {
                const card = document.createElement('div');
                card.className = "product-card bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100";
                
                card.innerHTML = `
                    <div class="overflow-hidden">
                        <img src="${p.img}" class="w-full h-56 md:h-64 object-cover">
                    </div>
                    <div class="p-5">
                        <h3 class="font-semibold text-base leading-tight">${p.name}</h3>
                        <p class="text-sm text-gray-600 mt-2 line-clamp-2">${p.desc}</p>
                        <p class="mt-4 font-medium text-[#9b4925]">USh ${p.price.toLocaleString('en-US')}</p>
                        <button onclick="event.stopImmediatePropagation(); addToCart(${p.id});" 
                                class="mt-6 w-full bg-[#8B4513] hover:bg-amber-900 text-white py-3 rounded-2xl text-sm font-medium flex items-center justify-center gap-2 transition-colors">
                            <i class="fa-solid fa-cart-plus"></i> Add to Cart
                        </button>
                    </div>
                `;

                // Click anywhere on card (except button) → go to product details
                card.addEventListener('click', () => {
                    window.location.href = `product-details.html?id=${p.id}`;
                });

                container.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentFilter = cat;
            
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active', 'bg-[#8B4513]', 'text-white');
                if ((cat === 'all' && btn.textContent === 'All') || btn.textContent.toLowerCase() === cat) {
                    btn.classList.add('active', 'bg-[#8B4513]', 'text-white');
                }
            });

            const filtered = cat === 'all' 
                ? products 
                : products.filter(p => p.category === cat);
            
            renderProducts(filtered);
        }

        // Search
        document.getElementById('search-input').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(term) || 
                p.desc.toLowerCase().includes(term)
            );
            renderProducts(filtered);
        });

        // ==================== CART FUNCTIONS (Same as index.html) ====================
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;

            const existing = cart.find(i => i.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({...product, quantity: 1});
            }
            updateCartCount();
            showToast("Added to cart");
        }

        function updateCartCount() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').textContent = count;
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-8 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-[150]";
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            if (drawer.classList.contains('translate-x-full')) {
                renderCart();
                drawer.classList.remove('translate-x-full');
            } else {
                drawer.classList.add('translate-x-full');
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full py-20 text-center text-gray-400">
                        <i class="fa-solid fa-cart-shopping text-6xl mb-6"></i>
                        <p>Your cart is empty.</p>
                    </div>
                `;
                document.getElementById('cart-total').textContent = "USH 0";
                return;
            }

            let total = 0;
            let html = '';
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                html += `
                    <div class="flex gap-4 mb-8">
                        <img src="${item.img}" class="w-20 h-20 object-cover rounded-xl">
                        <div class="flex-1">
                            <p class="font-medium">${item.name}</p>
                            <p class="text-sm text-gray-500">USh ${item.price.toLocaleString()}</p>
                            <div class="flex justify-between mt-4">
                                <span>Qty: ${item.quantity}</span>
                                <span class="font-medium">USh ${itemTotal.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cart-total').textContent = `USH ${total.toLocaleString('en-US')}`;
        }

        function checkout() {
            alert("Thank you for your purchase! 🎉 This is a demo.");
            cart = [];
            updateCartCount();
            toggleCart();
        }

        // Initialize
        window.onload = () => {
            renderProducts(products);
        };
    </script>
</body>
</html>
