<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - enono MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        .heading-font { 
            font-family: 'Playfair Display', sans-serif; 
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center py-12">
    <div class="max-w-md w-full px-6">
        
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-3 justify-start">
                <img src="../images/drum_logo.jpg" alt="" class="h-14 w-12">
                <div class=" flex flex-col justify-start">
                    <div class="heading-font text-5xl font-bold tracking-tighter text-black">Enono</div>
                    <div class=" pl-2 text-sm tracking-widest text-[#8B4513] -mt-1 text-start">MARKET</div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow border border-gray-100 p-8">
            <h1 class="text-2xl font-semibold mb-6">Sign in</h1>

            <form>
                <!-- Email -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" placeholder="Enter your email address" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" placeholder="Enter your password" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Sign In Button -->
                <button type="submit" 
                        class="w-full bg-[#8B5000] hover:bg-amber-500 text-black font-semibold py-3.5 rounded-xl text-lg transition-colors text-white hover:bg-[#8B4513]">
                    Sign In
                </button>
            </form>

            <div class="text-center mt-6">
                <a href="#" class="text-amber-600 hover:underline text-sm">Forgot your password?</a>
            </div>

            <div class="mt-8 text-center border-t pt-6">
                <p class="text-sm">
                    New to enono MARKET? 
                    <a href="signup.html" class="text-amber-600 hover:underline font-medium">Create account</a>
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-10 text-xs text-gray-500">
            <div class="flex justify-center gap-6 mb-4">
                <a href="#" class="hover:text-gray-700">Conditions of Use</a>
                <a href="#" class="hover:text-gray-700">Privacy Notice</a>
                <a href="help.html" class="hover:text-gray-700">Help</a>
            </div>
            <p>© 2026 enono MARKET. All Rights Reserved.</p>
        </div>
    </div>

<script>
    // Optional: Add form submission alert
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        alert("Sign In successful! Welcome back to enono MARKET ✨");
    });
</script>
</body>
</html>
