<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - enono MARKET</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');
        
        .heading-font { 
            font-family: 'Playfair Display', sans-serif; 
        }
    </style>
</head>
<body class="bg-white min-h-screen flex items-center justify-center py-12">
    <div class="max-w-md w-full px-6">
        
        <!-- Logo -->
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-amber-400 rounded-3xl flex items-center justify-center text-4xl">🌍</div>
                <div>
                    <div class="heading-font text-5xl font-bold tracking-tighter text-amber-400">enono</div>
                    <div class="text-xs tracking-widest text-amber-600 -mt-1 text-center">MARKET</div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow border border-gray-100 p-8">
            <h1 class="text-2xl font-semibold mb-6">Create account</h1>

            <form>
                <!-- Email -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" placeholder="Enter your email address" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Name -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-1">Your name</label>
                    <input type="text" placeholder="First and last name" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <label class="block text-sm font-medium mb-1">Password (at least 6 characters)</label>
                    <input type="password" placeholder="" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-400">
                    <div class="flex items-center gap-2 mt-2 text-xs text-gray-500">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Passwords must be at least 6 characters.</span>
                    </div>
                </div>

                <!-- Re-enter Password -->
                <div class="mb-8">
                    <label class="block text-sm font-medium mb-1">Re-enter password</label>
                    <input type="password" placeholder="" 
                           class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:border-amber-400">
                </div>

                <!-- Continue Button -->
                <button type="submit" 
                        class="w-full bg-amber-400 hover:bg-amber-500 text-black font-semibold py-3.5 rounded-xl text-lg transition-colors">
                    Continue
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-sm">
                    Already have an account? 
                    <a href="#" onclick="switchToSignIn()" class="text-amber-600 hover:underline">Sign in instead</a>
                </p>
            </div>

            <div class="mt-8 text-[13px] text-gray-500 text-center">
                By creating an account, you agree to enono MARKET's<br>
                <a href="#" class="text-amber-600 hover:underline">Conditions of Use</a> and 
                <a href="#" class="text-amber-600 hover:underline">Privacy Notice</a>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-10 text-xs text-gray-500">
            <div class="flex justify-center gap-6 mb-4">
                <a href="#" class="hover:text-gray-700">Conditions of Use</a>
                <a href="#" class="hover:text-gray-700">Privacy Notice</a>
                <a href="help.html" class="hover:text-gray-700">Help</a>
            </div>
            <p>© 2026 enono MARKET. All Rights Reserved.</p>
        </div>
    </div>

<script>
    function switchToSignIn() {
        alert("Sign In page would appear here ✨");
    }
</script>
</body>
</html>
